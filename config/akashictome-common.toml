# Akashic Tome -- pack defaults.
#
# It decides what can be absorbed by SUBSTRING-MATCHING the item's registry id
# against "Whitelisted Names" below. That is why most guidebooks work without
# configuration, and also why unrelated items match by accident.
#
# The additions to "Blacklisted Items" are the false positives in this pack:
#   twilightforest:canopy_bookshelf / chiseled_canopy_bookshelf  -> contain "book"
#   twilightforest:death_tome_spawn_egg                          -> contains "tome"
#   mekanism:energy_tablet                                       -> contains "tablet"
#   actuallyadditions:book_pattern                               -> a crafting pattern
#   minecraft:bookshelf / chiseled_bookshelf                     -> contain "book"
#   minecraft:enchanted_book                                     -> contains "book";
#       absorbing one instead of using it on an anvil would be a nasty surprise
#   minecraft:book / writable_book / written_book / knowledge_book
#       vanilla books are crafting materials and writing tools, not guidebooks --
#       the tome should only ever take mod documentation
# Everything else in the defaults is upstream's list, kept as shipped.
#
# Real books this pack has, for reference: actuallyadditions:booklet, ae2:guide,
# guideme:guide, cookingforblockheads:recipe_book, ftbquests:book,
# immersiveengineering:manual, mekanism:dictionary, productivemetalworks:book,
# silentgear:{guide_book,blueprint_book,material_book}, solcarrot:food_book,
# and Patchouli's book_* variants.

"Allow all items to be added" = false
"Whitelisted Items" = ["roots:runedtablet", "opencomputers:tool:4", "immersiveengineering:tool:3", "integrateddynamics:on_the_dynamics_of_integration", "theoneprobe:probenote", "evilcraft:origins_of_darkness", "draconicevolution:info_tablet", "charset:tablet", "antiqueatlas:antique_atlas", "theurgy:grimiore", "tconstruct:materials_and_you", "tconstruct:puny_smelting", "tconstruct:mighty_smelting", "tconstruct:tinkers_gadgetry", "tconstruct:fantastic_foundry", "tetra:holo", "occultism:dictionary_of_spirits"]
